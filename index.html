<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bw-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Homepage defaults; keep in step with src/data/homeSeo.js -->
    <title>BallotWatch - Congressional Voting Records, Bill Tracker & Representative Lookup</title>
    <meta name="description" content="See how your senators and representative vote, browse bills in plain English, and follow Congress, with every fact linked to its official source." />
    <meta name="keywords" content="congressional voting records, track congress votes, find my representative, who represents me in congress, congressional bill tracker, senator voting record, house representative votes, government shutdown tracker, legislation tracker, how did my congressman vote, US Congress members, civic engagement, voting history, public legislative data" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.ballotwatch.io/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ballotwatch.io/" />
    <meta property="og:title" content="BallotWatch - Congressional Voting Records" />
    <meta property="og:description" content="See how your senators and representative vote, browse bills in plain English, and follow Congress, with every fact linked to its official source." />
    <meta property="og:image" content="https://www.ballotwatch.io/congress.jpg" />
    <meta property="og:site_name" content="BallotWatch" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BallotWatch - Congressional Voting Records" />
    <meta name="twitter:description" content="See how your senators and representative vote, browse bills in plain English, and follow Congress, with every fact linked to its official source." />
    <meta name="twitter:image" content="https://www.ballotwatch.io/congress.jpg" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="BallotWatch" />
    <meta name="theme-color" content="#FAFAF7" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BallotWatch",
      "description": "Congressional voting tracker with representative lookup, bill browsing, source-linked explanations, and public methodology.",
      "applicationCategory": "Government",
      "operatingSystem": "Web",
      "featureList": [
        "Congressional voting records lookup",
        "Find your representative by address",
        "Source-linked bill explanations",
        "Government shutdown tracker",
        "Senator and House member profiles",
        "Bill tracking and search"
      ]
    }
    </script>

    <!-- Google Fonts: Instrument Serif + Geist Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:ital,wght@0,400..700;1,400&family=Instrument+Serif:ital@1&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Fontshare: General Sans -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p><strong>BallotWatch: the U.S. congressional voting record, source-linked.</strong></p>
      <p>Look up your senators and representative, review congressional voting records, browse bills with source-linked explanations, and follow public legislative data.</p>
      <p>Please enable JavaScript to use BallotWatch.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
