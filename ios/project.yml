name: BallotWatch
options:
  bundleIdPrefix: io.ballotwatch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 772YSVJ4U7
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BallotWatch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # A shared scheme, written into the generated project: Xcode Cloud and
    # `xcodebuild -scheme BallotWatch` both need one that is not per-user.
    scheme:
      testTargets:
        - BallotWatchTests
        - BallotWatchUITests
    sources:
      - path: BallotWatch
        excludes:
          - "**/.DS_Store"
          # Info.plist is wired through INFOPLIST_FILE, and the secrets
          # template is documentation — neither belongs in the bundle.
          - "Info.plist"
          - "Secrets.example.plist"
          - "BallotWatch-macOS.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ballotwatch.app
        PRODUCT_NAME: BallotWatch
        INFOPLIST_FILE: BallotWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # Mac version: Mac Catalyst, same bundle ID as iOS so App Store
        # Connect treats both as one app. The Mac App Store requires the
        # sandbox; the entitlements apply only to the Mac build.
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": BallotWatch/BallotWatch-macOS.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO

  BallotWatchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BallotWatchTests
    dependencies:
      - target: BallotWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ballotwatch.app.tests
        GENERATE_INFOPLIST_FILE: YES

  BallotWatchUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BallotWatchUITests
    dependencies:
      - target: BallotWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ballotwatch.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BallotWatch
