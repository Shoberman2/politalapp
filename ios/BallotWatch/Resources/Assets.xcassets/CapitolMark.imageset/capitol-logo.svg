<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" fill="white">
  <!-- Statue of Freedom on top -->
  <rect x="98" y="0" width="4" height="8" rx="1"/>
  <circle cx="100" cy="0" r="2.5"/>

  <!-- Dome top (tholos/lantern) -->
  <path d="M93 12 Q93 6, 100 4 Q107 6, 107 12 Z"/>
  <rect x="92" y="12" width="16" height="3" rx="0.5"/>

  <!-- Main dome -->
  <path d="M80 36 Q80 14, 100 12 Q120 14, 120 36 Z"/>

  <!-- Dome drum with column lines -->
  <rect x="78" y="36" width="44" height="7" rx="1"/>
  <line x1="84" y1="36" x2="84" y2="43" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="90" y1="36" x2="90" y2="43" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="96" y1="36" x2="96" y2="43" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="102" y1="36" x2="102" y2="43" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="108" y1="36" x2="108" y2="43" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="114" y1="36" x2="114" y2="43" stroke="white" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Central pediment (triangle) -->
  <polygon points="68,50 100,42 132,50"/>

  <!-- Central portico columns -->
  <rect x="72" y="50" width="3.5" height="28"/>
  <rect x="82" y="50" width="3.5" height="28"/>
  <rect x="92" y="50" width="3.5" height="28"/>
  <rect x="104" y="50" width="3.5" height="28"/>
  <rect x="114" y="50" width="3.5" height="28"/>
  <rect x="124" y="50" width="3.5" height="28"/>

  <!-- Central building body behind columns -->
  <rect x="75" y="50" width="50" height="28" opacity="0.3"/>

  <!-- Central entablature -->
  <rect x="68" y="78" width="64" height="4" rx="1"/>

  <!-- Left wing -->
  <rect x="14" y="58" width="56" height="24" rx="1"/>
  <!-- Left wing pediment -->
  <polygon points="12,58 42,50 72,58"/>
  <!-- Left wing window/column details -->
  <rect x="20" y="62" width="2.5" height="16" opacity="0.5"/>
  <rect x="30" y="62" width="2.5" height="16" opacity="0.5"/>
  <rect x="40" y="62" width="2.5" height="16" opacity="0.5"/>
  <rect x="50" y="62" width="2.5" height="16" opacity="0.5"/>
  <rect x="60" y="62" width="2.5" height="16" opacity="0.5"/>

  <!-- Right wing -->
  <rect x="130" y="58" width="56" height="24" rx="1"/>
  <!-- Right wing pediment -->
  <polygon points="128,58 158,50 188,58"/>
  <!-- Right wing column details -->
  <rect x="137" y="62" width="2.5" height="16" opacity="0.5"/>
  <rect x="147" y="62" width="2.5" height="16" opacity="0.5"/>
  <rect x="157" y="62" width="2.5" height="16" opacity="0.5"/>
  <rect x="167" y="62" width="2.5" height="16" opacity="0.5"/>
  <rect x="177" y="62" width="2.5" height="16" opacity="0.5"/>

  <!-- Base platform / steps -->
  <rect x="8" y="82" width="184" height="5" rx="1.5"/>
  <rect x="4" y="87" width="192" height="4" rx="1.5" opacity="0.85"/>
  <rect x="0" y="91" width="200" height="3.5" rx="1.5" opacity="0.7"/>
</svg>
