# =============================================================================
# Procedural Vote Backfill — Wide-Window ETL
# =============================================================================
# The main daily ETL (etl-daily.yml) only fetches the last 7 days. That's
# enough for new votes but leaves historical roll_calls.question fields empty
# on rows that existed before the procedural-vote feature shipped.
#
# This workflow runs a wider window (default 365 days) on a slower cadence to
# fill in question/description text on roll_calls rows that pre-existed the
# feature. Rate-limit-bounded; safely concurrent with the main daily ETL.
#
# Schedule: Weekly, Sunday at 8:00 AM UTC (3:00 AM EST). Offset from the
# main daily ETL (6:00 AM UTC) so they don't collide.
#
# Manual trigger: workflow_dispatch with adjustable window.
#
# Required Secrets (same set as etl-daily.yml):
#   CONGRESS_API_KEY          - Congress.gov API key
#   SUPABASE_URL              - Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY - Supabase service role key
#
# OPENAI_API_KEY is intentionally NOT used here. Backfill always passes
# --skip-enrich so a stale/rotating OpenAI key never blocks the procedural-
# vote question population (which is the whole point of this run).

name: Procedural Vote Backfill

permissions:
  contents: read

on:
  # Weekly on Sunday at 8 AM UTC (offset +2h from the main daily ETL).
  schedule:
    - cron: '0 8 * * 0'

  # Manual trigger with adjustable window.
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days to look back (default 600 covers the full 119th Congress, which opened 2025-01-03)'
        required: false
        default: '600'
        type: string
      max_votes:
        description: 'Hard cap on total votes processed (rate-limit guard)'
        required: false
        default: '15000'
        type: string

# Don't run concurrently with itself OR with the main daily ETL — both
# write to the same Supabase tables.
concurrency:
  group: etl-pipeline
  cancel-in-progress: false

jobs:
  procedural-backfill:
    name: Backfill roll_calls.question on historical votes
    runs-on: ubuntu-latest
    # Measured: a 365-day window ran 1h27m against the old 90m cap — three
    # minutes of headroom, and the 2026-07-05 run was cancelled outright at
    # 1h30m. A 600-day window (full 119th Congress) extracts proportionally
    # more, so the cap has to clear it with room rather than sit on it.
    # Dropping pre-warm below returns ~20 min of that budget.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.CONGRESS_API_KEY }}" ]; then
            echo "::error::CONGRESS_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set"
            exit 1
          fi

      - name: Snapshot roll_calls coverage BEFORE
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Count how many roll_calls rows have question populated, so we
          # can show the delta after the run completes.
          TOTAL=$(curl -s -I "${SUPABASE_URL}/rest/v1/roll_calls?select=id" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" -H "Range: 0-0" 2>/dev/null \
            | grep -i '^content-range:' | awk -F'/' '{print $2}' | tr -d '\r\n')
          POPULATED=$(curl -s -I "${SUPABASE_URL}/rest/v1/roll_calls?select=id&question=not.is.null" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" -H "Range: 0-0" 2>/dev/null \
            | grep -i '^content-range:' | awk -F'/' '{print $2}' | tr -d '\r\n')
          echo "BEFORE: $POPULATED of $TOTAL roll_calls have question populated"
          echo "POP_BEFORE=$POPULATED" >> $GITHUB_ENV
          echo "TOTAL_BEFORE=$TOTAL" >> $GITHUB_ENV
          # Tally coverage is the number this backfill actually moves: a roll
          # call only gets a roll_call_stats row once its member votes land.
          STATS=$(curl -s -I "${SUPABASE_URL}/rest/v1/roll_call_stats?select=roll_call_id" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" -H "Range: 0-0" 2>/dev/null \
            | grep -i '^content-range:' | awk -F'/' '{print $2}' | tr -d '\r\n')
          echo "BEFORE: $STATS of $TOTAL roll_calls have a tally (roll_call_stats row)"
          echo "STATS_BEFORE=$STATS" >> $GITHUB_ENV

      - name: Run Procedural Backfill ETL
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ETL_DAYS_BACK: ${{ github.event.inputs.days_back || '600' }}
          ETL_MAX_VOTES: ${{ github.event.inputs.max_votes || '15000' }}
        run: |
          DAYS="${{ github.event.inputs.days_back || '600' }}"
          echo "Running procedural backfill: --days $DAYS --skip-enrich --skip-prewarm"
          # --skip-enrich avoids the OpenAI bill-summary step (irrelevant for
          # this workflow's purpose, and may 401 if the OpenAI key is stale).
          # --skip-prewarm likewise: warming long-form bill explanations has
          # nothing to do with backfilling votes, and it was spending 20 minutes
          # of a 90-minute budget on every run. The daily ETL warms the cache.
          npm run etl -- --days "$DAYS" --skip-enrich --skip-prewarm

      - name: Snapshot roll_calls coverage AFTER
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TOTAL=$(curl -s -I "${SUPABASE_URL}/rest/v1/roll_calls?select=id" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" -H "Range: 0-0" 2>/dev/null \
            | grep -i '^content-range:' | awk -F'/' '{print $2}' | tr -d '\r\n')
          POPULATED=$(curl -s -I "${SUPABASE_URL}/rest/v1/roll_calls?select=id&question=not.is.null" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" -H "Range: 0-0" 2>/dev/null \
            | grep -i '^content-range:' | awk -F'/' '{print $2}' | tr -d '\r\n')
          STATS=$(curl -s -I "${SUPABASE_URL}/rest/v1/roll_call_stats?select=roll_call_id" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: count=exact" -H "Range: 0-0" 2>/dev/null \
            | grep -i '^content-range:' | awk -F'/' '{print $2}' | tr -d '\r\n')
          DELTA=$((POPULATED - POP_BEFORE))
          STATS_DELTA=$((STATS - STATS_BEFORE))
          echo "AFTER: $POPULATED of $TOTAL roll_calls have question populated"
          echo "AFTER: $STATS of $TOTAL roll_calls have a tally"
          echo "Delta this run: +$DELTA question rows, +$STATS_DELTA tallies"
          # Alert in the workflow summary
          {
            echo "## Procedural Backfill Result"
            echo ""
            echo "| Metric | Before | After | Delta |"
            echo "|---|---|---|---|"
            echo "| roll_calls with question populated | $POP_BEFORE | $POPULATED | +$DELTA |"
            echo "| roll_calls with a tally (roll_call_stats) | $STATS_BEFORE | $STATS | +$STATS_DELTA |"
            echo "| Total roll_calls | $TOTAL_BEFORE | $TOTAL | +$((TOTAL - TOTAL_BEFORE)) |"
            echo ""
            if [ "$POPULATED" -gt 0 ] && [ "$TOTAL" -gt 0 ]; then
              PCT=$((POPULATED * 100 / TOTAL))
              echo "Coverage: **${PCT}%** of roll_calls now have question text."
            fi
            if [ "$STATS" -gt 0 ] && [ "$TOTAL" -gt 0 ]; then
              SPCT=$((STATS * 100 / TOTAL))
              echo "Tally coverage: **${SPCT}%** of roll_calls now have a yea-nay tally."
            fi
          } >> $GITHUB_STEP_SUMMARY
