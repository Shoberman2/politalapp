name: Daily ETL Pipeline

on:
  schedule:
    # 6 AM ET (11:00 UTC during EDT, 10:00 UTC during EST)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allow manual runs

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ETL pipeline
        env:
          CONGRESS_API_KEY: ${{ secrets.ETL_CONGRESS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx etl/run.ts --skip-enrich

      - name: Run AI enrichment (separate step, optional)
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          CONGRESS_API_KEY: ${{ secrets.ETL_CONGRESS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx etl/run.ts --enrich-only
        continue-on-error: true
