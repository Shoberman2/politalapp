# =============================================================================
# Political Vote Tracker - Long-form Explanation Backfill
# =============================================================================
# Drains the bill_explanations backlog in one long run: every bill of the
# current Congress (ETL_EXPLAIN_CONGRESSES) without an explanation gets one,
# written by AI from the bill's official text (shared/billExplainer.js), so
# readers never wait for the first one on BillDetail.
#
# Trigger: manual only (workflow_dispatch). The daily ETL handles incremental
# top-up — this workflow is for the initial fill or for re-warming after a
# MODEL / PROMPT_VERSION bump.
#
# Cost note: one OpenAI call per bill (two if the first answer guessed), about
# 3k-30k input tokens each. Paced to CONGRESS_CALLS_PER_HOUR (default 2,000)
# so the website's share of the Congress.gov key is never used up; at that
# pace a run explains about 1,500 bills an hour.
#
# Required Secrets (same as daily ETL):
#   CONGRESS_API_KEY          - reads each bill's text versions and summaries
#   OPENAI_API_KEY            - writes the explanations
#   SUPABASE_URL              - target Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY - writes bill_explanations

name: Backfill Bill Explanations

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      max_bills:
        description: 'Override how many uncached bills to process (default: unlimited)'
        required: false
        default: ''
        type: string

# Share the daily ETL's concurrency group so a 6-hour backfill cannot run
# concurrently with the daily ETL (both write the same DB).
concurrency:
  group: etl-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill bill_explanations
    runs-on: ubuntu-latest
    # GitHub Actions max. About 9,000 bills at the default pace; rerun to
    # finish a larger backlog (finished bills are skipped).
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run explanation backfill
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The --backfill-explanations flag passes maxBills=100000 internally;
          # the input below lets an operator narrow it for testing.
          ETL_PREWARM_MAX: ${{ github.event.inputs.max_bills }}
          # Use the whole job: stop 10 minutes before the 6-hour limit.
          ETL_PREWARM_BUDGET_MS: '20400000'
        run: npm run etl -- --backfill-explanations
