# Tells IndexNow search engines (Bing and others) what changed: after each
# deploy to main, and each morning after the daily ETL has loaded new votes.
name: IndexNow

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    # 07:15 UTC: after the 06:00 ETL has finished loading.
    - cron: '15 7 * * *'
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # A push triggers a Vercel deploy; wait for it to be live before pinging.
      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: sleep 300
      - name: Submit changed pages
        run: node scripts/indexnow.mjs
