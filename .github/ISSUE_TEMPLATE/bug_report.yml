name: Bug report
description: Report a reproducible problem in the app, API, docs, or ETL.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what broke and what you expected instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page, endpoint, or file
      placeholder: "https://www.ballotwatch.io/bills or src/components/..."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to...\n2. Click...\n3. See..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, console errors, response bodies, or logs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - API
        - ETL
        - Data
        - Docs
        - Accessibility
        - Unsure
